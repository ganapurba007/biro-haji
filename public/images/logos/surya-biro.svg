<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="suryaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="suryaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Blue Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#suryaBlue)" stroke="url(#suryaGold)" stroke-width="3" />

  <!-- Surya (Sun Rays) Motif behind Ka'bah/Dome -->
  <circle cx="50" cy="45" r="28" stroke="url(#suryaGold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Stylized Ka'bah Cube Centerpiece -->
  <g transform="translate(32, 30)">
    <rect x="4" y="8" width="28" height="26" rx="2" fill="#0B132B" stroke="url(#suryaGold)" stroke-width="2" />
    <!-- Kiswah Gold Band -->
    <rect x="4" y="14" width="28" height="4" fill="url(#suryaGold)" />
    <!-- Ka'bah Door -->
    <rect x="22" y="20" width="6" height="14" rx="1" fill="url(#suryaGold)" />
  </g>

  <!-- Base Arch / Ribbon -->
  <path d="M24 70 C36 64 64 64 76 70" stroke="url(#suryaGold)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="67" r="3" fill="#FBBF24" />
</svg>
